# Location precision and identifier exposure per role.
#
# Precision is expressed as geohash characters because truncating a geohash
# degrades precision predictably: 5 characters is roughly a 5 km cell, 7 about
# 150 m, 9 about 5 m. A masked coordinate is returned as the centre of its cell,
# so a map marker always falls inside the true cell.
default_role: VIEWER
vin_mask_pattern: "***"

# Viewing an unmasked position is a privacy-relevant read and is written to the
# audit log even when the role is permitted to do it.
audit_full_precision_access: true

roles:
  VIEWER:
    geohash_precision: 5          # ~5 km cell
    show_vin: false
    show_driver: false
    full_precision_on_investigation: false

  ANALYST:
    geohash_precision: 7          # ~150 m cell
    show_vin: false
    show_driver: false
    full_precision_on_investigation: true

  FLEET_MANAGER:
    geohash_precision: 8          # ~38 m cell
    show_vin: true
    show_driver: false
    full_precision_on_investigation: true

  ADMIN:
    geohash_precision: 12         # effectively unmasked
    show_vin: true
    show_driver: true
    full_precision_on_investigation: true
