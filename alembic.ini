[alembic]
script_location = apps/api/alembic
prepend_sys_path = .
# UTC, and a filename that sorts chronologically. Migration order is part of the
# schema's history and should not depend on a revision hash's alphabet.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# The URL is supplied by env.py from POSTGRES_URL so the same file works in
# Compose, CI, and a local shell. Left blank deliberately: a committed connection
# string is a credential waiting to leak.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
