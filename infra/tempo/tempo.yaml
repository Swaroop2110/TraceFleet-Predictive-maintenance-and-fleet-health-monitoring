# Tempo, single-binary mode for local tracing.
#
# Storage lives under /var/tempo, which Compose mounts as a named volume. The
# upstream example uses /tmp, which would discard every trace on container restart
# and make "show me the trace for that incident" unreliable mid-demo.

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Short blocks so a trace becomes searchable within a demo rather than after the
  # default flush interval.
  max_block_duration: 2m
  complete_block_timeout: 1m

compactor:
  compaction:
    # Matches the Prometheus retention window; a trace outliving its metrics has
    # little diagnostic value.
    block_retention: 24h

querier:
  max_concurrent_queries: 10

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
