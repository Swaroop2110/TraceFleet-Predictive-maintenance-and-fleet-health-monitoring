# Prometheus scrape configuration.
#
# Each processor role exposes its own metrics port because they are separate
# processes with separate registries; scraping only the API would miss consumer lag,
# which is the number the back-pressure gate is judged on.

global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    platform: tracefleet
    environment: ${OTEL_ENVIRONMENT:-development}

rule_files:
  - /etc/prometheus/tracefleet-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tracefleet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # One target per role. The port assignments match DEFAULT_METRICS_PORT in
  # apps/stream-processor/processor/main.py.
  - job_name: tracefleet-validator
    static_configs:
      - targets: ["validator:9108"]
        labels:
          service: validator
          consumer_group: validator

  - job_name: tracefleet-incident-processor
    static_configs:
      - targets: ["incident-processor:9109"]
        labels:
          service: incident-processor
          consumer_group: incident-processor

  - job_name: tracefleet-telemetry-sink
    static_configs:
      - targets: ["telemetry-sink:9110"]
        labels:
          service: telemetry-sink
          consumer_group: telemetry-sink

  - job_name: tracefleet-incident-persister
    static_configs:
      - targets: ["incident-persister:9111"]
        labels:
          service: incident-persister
          consumer_group: incident-persister

  # Only running under the `tools` profile, so a missing target here is expected.
  - job_name: tracefleet-simulator
    static_configs:
      - targets: ["simulator:9112"]
        labels:
          service: simulator

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
