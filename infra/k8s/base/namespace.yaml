apiVersion: v1
kind: Namespace
metadata:
  name: tracefleet
  labels:
    app.kubernetes.io/name: tracefleet
    # Enforces the restricted Pod Security Standard at admission: no privileged
    # containers, no host namespaces, non-root only. The workloads already comply,
    # so this makes a regression fail to schedule rather than run.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
