apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: tracefleet
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracefleet
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tracefleet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracefleet-env
            - secretRef:
                name: tracefleet-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: tracefleet-api
            # The API connects as the restricted role so Row-Level Security applies
            # to it. Using the owner URL here would leave RLS enabled and enforcing
            # nothing.
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: tracefleet-secrets
                  key: POSTGRES_URL
          # Liveness never touches a dependency: a database blip must not make the
          # orchestrator kill a working pod. Readiness does, so traffic is withheld
          # until the schema is reachable.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Read-only root filesystem, so anything that needs to write gets an
            # explicit mount. /tmp is needed by the Python runtime.
            - name: tmp
              mountPath: /tmp
            - name: jwt-keys
              mountPath: /var/lib/tracefleet/keys
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: profiles
              mountPath: /app/config/profiles
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-keys
          secret:
            secretName: tracefleet-jwt-keys
            optional: false
        - name: config
          configMap:
            name: tracefleet-config
        - name: profiles
          configMap:
            name: tracefleet-profiles
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: tracefleet
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  # Keeps at least one replica serving during a node drain.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow scale-down, so a brief lull does not remove capacity that is about to
      # be needed again.
      stabilizationWindowSeconds: 300
