# TraceFleet local stack.
#
#     cp .env.example .env && make up
#
# Startup order is enforced with healthchecks rather than sleeps. `migrate` runs to
# completion before any service that needs the schema starts, so a fresh clone comes
# up in one command without a race.
#
# Profiles keep the default start-up lean:
#   (default) stores, migrate, api, web, the four processor roles, observability
#   tools   kafka-ui, the simulator
#   tls     caddy terminating TLS
#
# The API and the processors share one image; they differ only in entrypoint.

x-processor-base: &processor-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['METRICS_PORT']+'/metrics',timeout=3)\""]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 5
  environment: &processor-env
    PROFILE: ${PROFILE:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    KAFKA_BROKER: kafka:9092
    REDIS_URL: redis://redis:6379/0
    # Processors connect as the owner: the persister writes incidents for every
    # tenant in one batch and cannot operate under a single-tenant RLS context.
    POSTGRES_URL: ${POSTGRES_OWNER_URL:-postgresql://tracefleet:tracefleet@postgres:5432/tracefleet}
    POSTGRES_OWNER_URL: ${POSTGRES_OWNER_URL:-postgresql://tracefleet:tracefleet@postgres:5432/tracefleet}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracefleet}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  depends_on:
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  volumes:
    - .:/app
  deploy:
    resources:
      limits:
        memory: 1g

services:
  # -------------------------------------------------------------------------
  # Stores
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracefleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracefleet}
      POSTGRES_DB: ${POSTGRES_DB:-tracefleet}
      # Deterministic collation, so index ordering does not depend on host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Hot state is a cache with TTLs; allkeys-lru bounds memory instead of letting
    # writes fail when it fills.
    command: >
      redis-server --save 60 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracefleet}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # HTTP ping, so the check does not depend on the client's auth configuration.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft: no ZooKeeper, per the PRD's fixed technology choices.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Durable buffering is what makes back-pressure safe: a paused consumer must
      # be able to fall behind without the broker discarding data.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-dev}
    volumes:
      - ./infra/docker/kafka-init.sh:/kafka-init.sh:ro
      - ./config:/config:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    restart: "no"

  # -------------------------------------------------------------------------
  # Schema
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Runs as the owner: DDL, the RLS policies, and the cross-tenant seed all
    # require ownership. Everything after this waits on it completing.
    environment:
      POSTGRES_OWNER_URL: ${POSTGRES_OWNER_URL:-postgresql://tracefleet:tracefleet@postgres:5432/tracefleet}
      POSTGRES_URL: ${POSTGRES_OWNER_URL:-postgresql://tracefleet:tracefleet@postgres:5432/tracefleet}
      POSTGRES_APP_ROLE: ${POSTGRES_APP_ROLE:-tracefleet_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-tracefleet_app}
      TRACEFLEET_SEED_DEMO_USERS: ${TRACEFLEET_SEED_DEMO_USERS:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-tracefleet-demo}
      OTEL_SDK_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # -------------------------------------------------------------------------
  # API and web
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TRACEFLEET_ENV: ${TRACEFLEET_ENV:-development}
      PROFILE: ${PROFILE:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The restricted role, so Row-Level Security actually applies to requests.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://tracefleet_app:tracefleet_app@postgres:5432/tracefleet}
      POSTGRES_OWNER_URL: ${POSTGRES_OWNER_URL:-postgresql://tracefleet:tracefleet@postgres:5432/tracefleet}
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracefleet}
      JWT_KEY_DIR: /var/lib/tracefleet/keys
      JWT_ISSUER: ${JWT_ISSUER:-https://tracefleet.local/auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tracefleet-api}
      TRACEFLEET_ALLOW_ANONYMOUS: ${TRACEFLEET_ALLOW_ANONYMOUS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-120}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      PROMETHEUS_URL: http://prometheus:9090
      CHAOS_EXECUTION_ENABLED: ${CHAOS_EXECUTION_ENABLED:-false}
      OTEL_SERVICE_NAME: tracefleet-api
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      # Persisted so generated JWT keys survive a restart and tokens stay valid.
      - jwt_keys:/var/lib/tracefleet/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    volumes:
      - ./apps/web:/app
      # Anonymous volume so the container's node_modules is not shadowed by the host.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Stream processing: four roles, four consumer groups
  # -------------------------------------------------------------------------
  validator:
    <<: *processor-base
    environment:
      <<: *processor-env
      OTEL_SERVICE_NAME: tracefleet-validator
      METRICS_PORT: 9108
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "apps/stream-processor/processor/main.py", "--role", "validator"]

  incident-processor:
    <<: *processor-base
    environment:
      <<: *processor-env
      OTEL_SERVICE_NAME: tracefleet-incident
      METRICS_PORT: 9109
    command: ["python", "apps/stream-processor/processor/main.py", "--role", "incident"]

  telemetry-sink:
    <<: *processor-base
    environment:
      <<: *processor-env
      OTEL_SERVICE_NAME: tracefleet-sink
      METRICS_PORT: 9110
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "apps/stream-processor/processor/main.py", "--role", "sink"]

  incident-persister:
    <<: *processor-base
    environment:
      <<: *processor-env
      OTEL_SERVICE_NAME: tracefleet-persister
      METRICS_PORT: 9111
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "apps/stream-processor/processor/main.py", "--role", "persister"]

  # -------------------------------------------------------------------------
  # Simulator (opt-in: a plain `up` should not generate an unbounded stream)
  # -------------------------------------------------------------------------
  simulator:
    <<: *processor-base
    profiles: ["tools"]
    environment:
      <<: *processor-env
      OTEL_SERVICE_NAME: tracefleet-simulator
      METRICS_PORT: 9112
      SIMULATOR_CONTROL_ENABLED: ${SIMULATOR_CONTROL_ENABLED:-false}
      SIMULATOR_CONTROL_HOST: 0.0.0.0
    ports:
      - "8100:8100"
    command: ["python", "apps/simulator/sim/main.py", "--profile", "${PROFILE:-dev}"]

  # -------------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0:0"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/tracefleet-alerts.yml:/etc/prometheus/tracefleet-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  # -------------------------------------------------------------------------
  # Tools
  # -------------------------------------------------------------------------
  k6:
    image: grafana/k6:0.58.0
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      TRACEFLEET_API_URL: http://api:8000
    volumes:
      - ./tests/performance:/tests:ro
      - ./artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tracefleet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    profiles: ["tls"]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  caddy_data:
  jwt_keys:
